<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobPilot Copilot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 360px;
      background: #080c14;
      color: #e2e8f0;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 14px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
    }
    .logo span {
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }
    .card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .detected-info {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .detected-sub {
      font-size: 11px;
      color: #38bdf8;
      margin-top: 2px;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .status-msg {
      padding: 8px;
      border-radius: 8px;
      font-size: 11px;
      margin-top: 8px;
      display: none;
    }
    .status-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      display: block;
    }
    .status-error {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      display: block;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      color: #64748b;
    }
    .footer a {
      color: #818cf8;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    input[type="text"] {
      width: 100%;
      background: #0b111e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: #fff;
      margin-top: 4px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>JobPilot</span> Copilot
    </div>
    <div class="badge" id="statusBadge">Connected</div>
  </div>

  <div class="card">
    <div class="label">Active Job Posting Detected</div>
    <div class="detected-info" id="detectedTitle">Analyzing active page...</div>
    <div class="detected-sub" id="detectedCompany">Checking ATS portal...</div>
  </div>

  <button id="clipBtn" class="btn btn-primary">
    <span>📌 1-Click Clip & Score Job</span>
  </button>

  <button id="autofillBtn" class="btn btn-secondary">
    <span>⚡ Auto-Fill Application Form</span>
  </button>

  <div id="statusBox" class="status-msg"></div>

  <div class="card" style="margin-top: 10px;">
    <div class="label">API Authorization Token (Bearer)</div>
    <input type="text" id="tokenInput" placeholder="Auto-synced or paste token here">
  </div>

  <div class="footer">
    <span>v1.0.0 (Manifest V3)</span>
    <a href="http://localhost:3000/dashboard" target="_blank">Open Web Dashboard ➔</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
